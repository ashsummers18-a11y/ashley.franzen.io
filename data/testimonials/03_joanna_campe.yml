text: |
  Ashley recently worked with Remineralize the Earth as a science writer and wrote a few excellent articles for us. She had a good understanding of the science behind our work and mission. I found her absolutely great to work with, always responding immediately as needed and very gracious. While she was with us, I definitely considered her a part of our close working team. She’s also a photographer and did a great photoshoot for an interview of a researcher currently based in Bonn.
author: Joanna Campe
position: Founder and Executive Director at Remineralize the Earth
